<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Spec Check</title>
<style>
  /* Defaults are the darkest-skin reference; applySkin() overrides them
     at runtime from Premiere's appSkinInfo. See DESIGN.md.
     Hard rule: the panel never grows as state changes. Views swap in
     place, results live in a dropdown, and the log absorbs leftover
     height. The single exception is the show-all metrics disclosure. */
  :root {
    --bg: #232323; --surface: #2a2a2a; --inset: #1b1b1b;
    --line: #3d3d3d; --text: #d6d6d6; --dim: #8f8f8f;
    --accent: #2d8ceb; --pass: #56a865; --fail: #d4593f;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; padding: 10px 12px; background: var(--bg); color: var(--text);
    font: 11px/1.5 "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column;
  }
  .view { display: flex; flex-direction: column; flex: 1; min-height: 0; }
  .view[hidden] { display: none; }
  .label {
    margin: 12px 0 5px; font-size: 10px; letter-spacing: .08em;
    text-transform: uppercase; color: var(--dim); font-weight: 600;
  }
  .row { display: flex; gap: 6px; align-items: center; }

  button, select, input[type=text], input[type=number] {
    background: var(--surface); color: var(--text);
    border: 1px solid var(--line); border-radius: 3px;
    padding: 4px 9px; font: 11px "Segoe UI", system-ui, sans-serif;
    transition: border-color .15s ease-out, opacity .15s ease-out;
  }
  button { cursor: pointer; white-space: nowrap; }
  button:hover, select:hover { border-color: var(--dim); }
  button:focus-visible, select:focus-visible, input:focus-visible {
    outline: 1px solid var(--accent); outline-offset: 0;
  }
  button:disabled, input:disabled { opacity: .5; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { filter: brightness(1.1); }
  button.icon { padding: 4px 7px; }
  select { padding-right: 20px; }
  input[type=text] { flex: 1; }
  input[type=number] { width: 62px; padding: 4px 5px; font-family: Consolas, monospace; }
  input::placeholder { color: var(--dim); }

  .dot {
    width: 8px; height: 8px; border-radius: 50%; flex: none;
    background: var(--dim); transition: background .15s ease-out;
  }
  .dot.pass { background: var(--pass); }
  .dot.fail { background: var(--fail); }
  #resultSel { flex: 1; }

  /* scoreboard */
  #metrics { margin-top: 8px; overflow-y: auto; flex: none; }
  #metrics .mrow {
    display: flex; align-items: center; gap: 10px;
    padding: 3px 6px; border-bottom: 1px solid var(--line);
  }
  #metrics .mrow .mlabel {
    flex: 1 1 40%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #metrics .mrow.unchecked .mlabel,
  #metrics .mrow.unchecked .mval { color: var(--dim); }
  .mval {
    font: 11px Consolas, monospace; white-space: nowrap;
    flex: 0 0 84px; text-align: right;
  }
  .mval.pass { color: var(--pass); }
  .mval.fail { color: var(--fail); }
  .mreq {
    font: 10px Consolas, monospace; color: var(--dim);
    flex: 0 0 90px; text-align: center; white-space: nowrap;
  }
  .mfoot { display: flex; }
  .mtoggle, .msave {
    padding: 5px 6px; color: var(--dim); font-size: 10px; cursor: pointer;
    transition: color .15s ease-out;
  }
  .mtoggle:hover, .msave:hover { color: var(--text); }
  .mtoggle { flex: 1; }

  /* settings: custom preset editor */
  #cpChecks { margin-top: 4px; }
  .cprow { display: flex; gap: 6px; align-items: center; padding: 3px 0; }
  .cprow select { flex: 1; }
  .cprow .x {
    color: var(--dim); cursor: pointer; padding: 0 5px; font-size: 13px;
  }
  .cprow .x:hover { color: var(--fail); }
  .hint { color: var(--dim); font-size: 10px; margin-top: 6px; }

  #log {
    margin-top: 12px; flex: 1; min-height: 52px; overflow-y: auto;
    background: var(--inset); border-radius: 3px;
    padding: 5px 7px; font: 10px Consolas, monospace; color: var(--dim);
    white-space: pre-wrap;
  }
  #log .bad { color: var(--fail); }
  #log .ok { color: var(--text); }
</style>
</head>
<body>

<div class="view" id="viewMain">
  <div class="row">
    <select id="preset" title="Delivery spec preset"></select>
    <button id="btnSettings" class="icon" title="Settings">&#9881;</button>
  </div>

  <div class="row" style="margin-top:8px">
    <span class="dot" id="rdot"></span><select id="resultSel"></select>
  </div>

  <div id="metrics"></div>

  <div class="label">Check</div>
  <div class="row">
    <select id="range" title="Range to render" style="flex:1">
      <option value="0">Entire sequence</option>
      <option value="1">In to out</option>
      <option value="2">Work area</option>
    </select>
    <button id="btnCheck" class="primary" disabled>Check mix</button>
    <button id="btnPick" disabled>Analyze file&hellip;</button>
  </div>
  <div class="row" style="margin-top:6px">
    <input type="text" id="watchPath" placeholder="or watch a folder for new exports">
    <button id="btnBrowse" title="Choose folder">&hellip;</button>
    <button id="btnWatch" disabled>Start</button>
  </div>

  <div id="log"></div>
</div>

<div class="view" id="viewSettings" hidden>
  <div class="row">
    <span class="label" style="margin:0; flex:1">Custom presets</span>
    <button id="btnDone" class="primary">Done</button>
  </div>

  <div class="row" style="margin-top:8px">
    <select id="cpSel"></select>
    <button id="cpNew">New</button>
    <button id="cpDelete">Delete</button>
  </div>
  <div class="row" style="margin-top:6px">
    <input type="text" id="cpName" placeholder="preset name">
  </div>

  <div id="cpChecks"></div>
  <div class="row" style="margin-top:4px">
    <button id="cpAddCheck">+ Add check</button>
    <button id="cpSave" class="primary">Save preset</button>
  </div>
  <div class="hint">
    Leave min or max blank for one-sided checks. Values use each metric's
    native unit (LUFS, dB, kbps, Hz, seconds). Room-tone noise floor: add a
    sequence marker named "roomtone" over a silent section before Check mix.
  </div>

  <div style="flex:1"></div>
</div>

  <script src="js/main.js"></script>
</body>
</html>
