<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spec Check: audio loudness checker for ACX, podcasts, and broadcast</title>
  <meta name="description" content="Check an audio file against ACX, Apple Podcasts, Spotify, YouTube, and broadcast loudness specs. Your file stays on your computer.">
  <link rel="canonical" href="https://www.trevorohare.com/spec-check">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://www.trevorohare.com/spec-check">
  <meta property="og:title" content="Spec Check: audio loudness checker for ACX, podcasts, and broadcast">
  <meta property="og:description" content="Check an audio file against ACX, Apple Podcasts, Spotify, YouTube, and broadcast loudness specs. Your file stays on your computer.">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#232323">
  <!-- Slate cut arrival: trevorohare.com wipes its red slab over the
       screen, sets this flag, and does a full page load to here. Cover
       the first paint with the same slab, hold a beat, then wipe it off,
       with the timing of SlateCut.tsx on that site. -->
  <script>
    try {
      if (sessionStorage.getItem("slate-arrive")) {
        sessionStorage.removeItem("slate-arrive");
        if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
          document.documentElement.classList.add("slate-arrive");
        }
      }
    } catch (e) {}
  </script>
  <style>
    html.slate-arrive::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 2147483647;
      background: oklch(55% 0.21 30);
      pointer-events: none;
      animation: slate-off 0.36s cubic-bezier(0.7, 0, 0.2, 1) 0.16s forwards;
    }
    @keyframes slate-off {
      to { transform: translateX(101%); visibility: hidden; }
    }
  </style>
</head>
<body>
  <main class="page">
    <h1>Spec Check</h1>
    <p class="lede">Check audio against ACX, Apple Podcasts, Spotify, YouTube, and broadcast specs.</p>

    <div class="drop" id="drop">
      <p class="drop-text">Drop a WAV or MP3 here</p>
      <button type="button" class="primary" id="choose">Choose a file</button>
      <input type="file" id="file" accept=".wav,.mp3,audio/wav,audio/x-wav,audio/wave,audio/mpeg" hidden>
    </div>
    <p class="privacy">Your file stays on your computer. Nothing is uploaded.</p>

    <div class="spec">
      <label class="label" for="spec">Spec</label>
      <select id="spec"></select>
    </div>

    <div class="progress" id="progress" hidden>
      <p class="progress-text" id="progressText"></p>
      <progress id="progressBar" max="100" value="0" aria-labelledby="progressText"></progress>
    </div>
    <div class="visually-hidden" role="status" aria-live="polite" id="announce"></div>
    <p class="error" role="alert" id="error"></p>

    <section class="results" id="results" aria-labelledby="verdict" hidden>
      <p class="verdict" id="verdict"><span class="dot" aria-hidden="true"></span><span id="verdictText"></span></p>
      <table>
        <caption id="caption"></caption>
        <thead>
          <tr>
            <th scope="col">Metric</th>
            <th scope="col" class="num">Value</th>
            <th scope="col" class="num col-target">Target</th>
            <th scope="col">Result</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </section>
  </main>

  <footer>
    <ul>
      <li><a href="https://www.trevorohare.com">Made by Trevor O'Hare</a></li>
      <li><a href="https://www.trevorohare.com/podcast-editing">Podcast editing</a></li>
      <li><a href="https://www.trevorohare.com/dev">Premiere Pro panel</a></li>
      <li><a href="https://github.com/tro2789/SpecCheck">Source</a></li>
      <li><a href="/spec-check/licenses.txt">Licenses</a></li>
    </ul>
  </footer>

  <script type="module" src="./src/main.ts"></script>
</body>
</html>
